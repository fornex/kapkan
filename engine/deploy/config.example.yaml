# Kapkan production configuration example.
# Copy to /etc/kapkan/config.yaml and adjust for your network.
#
# SAFETY: dry_run defaults to true. Leave it true until you have verified, via
# the logs and /api/v1/attacks, that detection fires on the right prefixes and
# that the would-be blackhole routes look correct. Only then set dry_run: false.

dry_run: true

listen:
  sflow: ":6343"
  netflow: ":2055" # NetFlow v5/v9 + IPFIX share this socket

sampling:
  default_rate: 1000 # used only when an exporter does not report its own rate

  # boundary: optional interface-boundary counting. Without it, every received
  # sample is counted — which OVER-COUNTS when the same packet is seen at more
  # than one sampling vantage point: redundant exporters (e.g. an MLAG pair),
  # ingress+egress sampling (Arista `sflow sample output`), or transit/peer
  # links. List each exporter's EXTERNAL (uplink/border) interfaces and a flow
  # is then counted toward a protected host only when it crosses the boundary:
  # inbound when it ENTERS on an external interface, outbound when it LEAVES on
  # one. Exporters not listed keep counting every sample, so this is safe to
  # roll out per exporter. egress_sampling: true halves the boundary rate to undo
  # an in+out double-count, but CALIBRATE before setting it — do NOT assume it
  # from `sflow sample output` alone. On some topologies (e.g. an MLAG pair) the
  # egress copy of an inbound packet uses a different input interface, so the
  # boundary already counts it once and true would HALVE a correct figure.
  # Tip: enable boundary_debug, watch kapkan_engine_boundary_debug_bytes_total
  # per (exporter, iface) and compare an external ifIndex to its real interface
  # counter; set egress_sampling: true only if it shows ~2x. Then turn debug off.
  # boundary_debug: false
  # boundary:
  #   - exporter: "10.1.32.2"
  #     external_ifindexes: [1000025]
  #     egress_sampling: false   # true ONLY if boundary_debug shows ~2x (calibrate)
  #   - exporter: "10.1.32.3"
  #     external_ifindexes: [1000025]
  #     egress_sampling: false   # true ONLY if boundary_debug shows ~2x (calibrate)

# flow_sources: optional allowlist of trusted flow-exporter (router) source
# addresses. Telemetry is unauthenticated UDP, so the source address is
# spoofable; listing your exporters here keeps the per-exporter `packets_total`
# metric labeled only for them (every other source is bucketed under "other"),
# preventing a spoofed-source flood from blowing up metric cardinality. When
# omitted, an internal cap bounds the labels automatically. Detection is
# unaffected either way.
# flow_sources:
#   - "198.51.100.7"
#   - "198.51.100.8"

networks: # detection applies ONLY to destinations inside these prefixes
  - "203.0.113.0/24"
  - "2001:db8::/32"

protected_whitelist: # these addresses are never banned, regardless of traffic
  - "203.0.113.1" # gateway / router
  - "203.0.113.2" # authoritative nameserver

thresholds: # per destination host, after sampling correction
  pps: 80000 # packets/sec
  mbps: 1000 # megabits/sec
  flows_per_sec: 35000 # flows/sec — NOTE: only NetFlow/IPFIX exporters carry
  #   flow records. sFlow exports one sample per packet (no flow aggregation),
  #   so sFlow-sourced hosts always report flows_per_sec=0 and this threshold
  #   never fires for them; use pps/tcp_syn_pps/udp_pps instead. The value is
  #   still required (> 0) for the NetFlow/IPFIX case.
  # Optional per-protocol limits, 0/absent = disabled. Any crossed limit
  # triggers (OR). tcp_syn counts pure SYNs; frag counts non-first fragments.
  # tcp_pps: 0
  # udp_pps: 40000
  # icmp_pps: 5000
  # tcp_syn_pps: 5000
  # frag_pps: 3000

# Optional: watch traffic LEAVING protected hosts (compromised machines).
# Same keys as `thresholds`; at least one required. Absent = outgoing
# traffic is not counted at all.
#
# thresholds_outgoing:
#   pps: 50000
#   udp_pps: 20000

# Continuous learned thresholds: detection tightens to each host's normal
# level × factor, bounded by `floor` below and the static thresholds above.
# Attack traffic never trains the baseline; learning input is clamped so a
# slow attacker ramp cannot quickly inflate it.
#
# baseline:
#   factor: 3
#   half_life_seconds: 3600
#   warmup_seconds: 600
#   floor:
#     pps: 5000
#     mbps: 50
#     flows_per_sec: 2000

# Carpet-bombing (subnet-spread) detection: catches an attack that spreads its
# volume across many hosts in a prefix, staying under every per-host threshold
# so per-host detection never fires. Folds each host's incoming rates into its
# aggregation prefix; raises a prefix-scoped (alert-only) attack when the
# aggregate crosses `thresholds` AND the traffic is spread across >= min_hosts
# distinct hosts. Set the aggregate thresholds well above the per-host ones.
#
# carpet:
#   aggregation_prefix_v4: 24  # aggregate per /24 (default)
#   aggregation_prefix_v6: 48  # and per /48 for IPv6 (default)
#   min_hosts: 10              # fan-out gate (minimum 2)
#   thresholds:                # AGGREGATE volume over the prefix
#     pps: 2000000
#     mbps: 20000
#   mitigation: flowspec       # empty (default) = alert-only; flowspec asks the
#                              # upstream to drop the vector to the whole prefix;
#                              # dataplane installs that same vector rule in THIS
#                              # box's kernel (needs a dataplane block, enabled);
#                              # blackhole RTBHs the whole prefix.
#                              # EVERY method refuses a prefix containing a
#                              # whitelisted address — one kernel/FlowSpec rule
#                              # here covers 256 addresses (a /24), so the
#                              # whitelist guarantee has no per-method exception.
#   max_active_prefix_bans: 10 # cap on simultaneous carpet bans (separate from host bans)

# Attack samples: recent flows are buffered continuously so detections carry
# their dominant sources/ports/protocols instantly. ~120 bytes per buffered
# flow; sizing changes require a restart.
#
# samples:
#   enabled: true
#   buffer_flows: 65536    # total ring capacity across the engine
#   flows_per_attack: 20   # raw flow records attached to one attack

# Optional: group prefixes under their own thresholds and mitigation policy.
# Hosts not matched by any group use the global thresholds above. The most
# specific (longest) prefix wins. Group prefixes must lie inside `networks`.
#
# hostgroups:
#   - name: web # per-host detection with tighter limits
#     networks:
#       - "203.0.113.0/26"
#     thresholds: # omit to inherit the global thresholds
#       pps: 20000
#       mbps: 500
#       flows_per_sec: 10000
#   - name: customers-no-rtbh # detect and notify, but never auto-blackhole
#     networks:
#       - "203.0.113.64/26"
#     ban: false
#   - name: dns-pool # alert on the pool's TOTAL traffic; never auto-bans
#     networks:
#       - "203.0.113.128/26"
#     calculation: total
#     thresholds:
#       pps: 300000
#       mbps: 4000
#       flows_per_sec: 150000
#   - name: customerA # multi-tenant: scope this group to a tenant (see api.tokens)
#     networks:
#       - "198.51.100.0/24"
#     tenant: "customerA"

# Multi-tenancy: label hostgroups with a `tenant` (above) and scope API tokens
# to a tenant (api.tokens[].tenant below). A scoped token sees and may mutate
# only its own tenant's attacks/bans/hosts; unscoped tokens are admin (all
# tenants). An unlabeled group is admin-only. Optionally label the global
# fallback group with a top-level `tenant:` here:
#
# tenant: "house"

# Mitigation method (default: blackhole = RTBH /32 or /128). FlowSpec drops
# only the attack vector and spares the victim's other traffic (RFC 8955/8956,
# IPv4 and IPv6). Hostgroups can override `mitigation`. Always dry-run-first:
# generated rules show in the API/notifications before you set dry_run: false.
#
# mitigation: flowspec
# flowspec:
#   action: discard      # or rate_limit
#   rate_mbps: 100       # required for rate_limit
#   source_anchored: true        # drop only the dominant attacker sources (from the
#                                # attack sample) to the victim, sparing its clients
#   min_source_concentration: 0.8 # ...but only when the top sources cover >= this
#                                # share of the attack; else fall back to victim-anchored
#
# Or an escalation ladder (supersedes `mitigation`): step the response up the
# longer an attack lasts. Each rung fires after the given seconds IF the
# attack is still active. First rung must be at 0; per-hostgroup overridable.
# Actions may only strengthen: none < flowspec < divert < blackhole.
#
# escalation:
#   - {after_seconds: 0,   action: none}        # alert only
#   - {after_seconds: 30,  action: flowspec}    # then surgical drop
#   - {after_seconds: 90,  action: divert}      # then divert to a scrubber
#   - {after_seconds: 300, action: blackhole}   # then blackhole if it persists

# Traffic diversion (scrubbing): the `divert` action announces the victim host
# route toward a scrubbing center instead of dropping it. Required to use the
# divert action / method. Per-hostgroup overridable via a group `scrubbing:`
# block (same shape as the per-group `bgp:` block).
#
# scrubbing:
#   next_hop: "192.0.2.100"   # scrubbing center next-hop (v4)
#   next_hop6: "100::100"     # required when IPv6 space is protected
#   community: "65000:200"    # optional divert community
#   local_pref: 200           # often raised so the divert route wins selection
#
#   # Managed scrubbing nodes: boxes running `kapkan scrub` that receive the
#   # diverted traffic, drop the attack in their XDP data plane and reinject
#   # what is left. The scalar next_hop above stays valid and is simply the
#   # one-node case. A node is chosen when the ban is created and frozen for
#   # its lifetime, so a victim's traffic never hops between nodes mid-attack;
#   # if that node stops polling the victim is RE-ANNOUNCED toward a surviving
#   # one, and on_all_nodes_lost applies only when none are left.
#   nodes:
#     - name: scrub-fra1
#       next_hop: "192.0.2.100"
#       next_hop6: "100::100"
#       capacity_mbps: 40000
#       hostgroups: [game-servers]   # affinity: which groups this node serves
#     - name: scrub-ams1
#       next_hop: "192.0.2.200"
#       capacity_mbps: 10000
#   node_selection: affinity        # affinity | least_loaded | ecmp
#   on_all_nodes_lost: withdraw     # withdraw | blackhole | flowspec
#   stale_after_seconds: 15         # no poll for this long => node is lost

# In-kernel data plane (XDP/eBPF). Lets THIS instance drop attack traffic on
# its own interfaces instead of only announcing routes — the surgical rung
# below flowspec, and the only one that needs no router cooperation. It can
# act only on traffic that actually reaches this machine's NIC, so it does not
# help once the uplink itself is saturated; that is what the ladder above it
# is for. Absent (the default) the feature does not exist and the binary
# behaves exactly as it does today.
#
# Requires Linux 5.15+ with BTF, and privileges the shipped systemd unit does
# NOT grant: CAP_BPF, CAP_NET_ADMIN, CAP_PERFMON, a writable /sys/fs/bpf and
# AF_NETLINK. Turning this on without them makes kapkan REFUSE TO START (with a
# message naming the cause) rather than run without the drops you configured.
# Install the drop-in that ships beside the unit on the same hosts:
#
#   install -D -m 0644 kapkan-dataplane.conf \
#       /etc/systemd/system/kapkan.service.d/10-dataplane.conf
#   systemctl daemon-reload && systemctl restart kapkan
#
# (packages put it at /usr/share/kapkan/kapkan-dataplane.conf). The reasoning
# and the measurements are in deploy/dataplane-operations.md §1.
#
# The default verdict is always PASS: anything not matched by a rule is
# forwarded. dry_run gates rule installation exactly as it gates BGP.
#
# dataplane:
#   interfaces: [eth0]        # NICs to attach to (restart required)
#   xdp_mode: auto            # auto (native, else generic) | native | generic
#   pin_path: /sys/fs/bpf/kapkan   # policy survives a restart of this process
#   on_exit: keep             # keep the program attached on shutdown, or detach
#   drop_malformed: false     # unparseable frames pass and are counted
#
#   # SOURCE prefixes that always pass, checked before every other rule. This
#   # is a different axis from protected_whitelist, which names DESTINATIONS
#   # that are never banned; both are enforced in the kernel.
#   allowlist:
#     - "198.51.100.7/32"     # monitoring
#     - "192.0.2.0/24"        # management network
#
#   # Named ceilings referenced by static rules. A profile nothing references
#   # is removed on reload.
#   ratelimit_profiles:
#     - {name: icmp_cap, mbps: 10}
#     - {name: dns_reply, pps: 50000}
#     - {name: handshake_cap, pps: 20}       # per source, see cap_tls_handshakes
#     - {name: quic_handshake_cap, pps: 20}  # per source, see cap_quic_handshakes
#   # A profile is also the BUCKET: the per-source token bucket is keyed
#   # {victim, source, profile}, so two rules naming the same profile draw
#   # down ONE shared budget per source, while separate profiles meter
#   # independently. Name one profile per independently-metered thing —
#   # which is why the TLS and QUIC handshake caps above are two profiles.
#
#   # Always-on operator rules, evaluated after the allowlists and before any
#   # rule the detector installs. Names are required and unique.
#   #
#   # match takes src, proto, src_port, dst_port and payload. `payload` narrows
#   # on what the L4 payload BEGINS with — the shape of a handshake, one value
#   # per transport, and the one message an ordinary connection sends exactly
#   # once:
#   #   tls_client_hello  a TCP segment opening a TLS ClientHello; requires
#   #                     proto: tcp
#   #   quic_initial      a UDP datagram opening a QUIC v1 Initial (the
#   #                     HTTP/3 handshake packet); requires proto: udp
#   # Both are read from fixed offsets with no reassembly and no decryption:
#   # a ClientHello split across segments, a QUIC v2 or version-negotiation
#   # packet, and anything too short to decide do not match and are forwarded.
#   static_rules:
#     - name: drop_chargen
#       match: {proto: udp, src_port: 19}
#       action: drop
#     - name: cap_icmp
#       match: {proto: icmp}
#       action: ratelimit
#       profile: icmp_cap
#     - name: cap_tls_handshakes   # a per-source ceiling on new TLS handshakes
#       match: {proto: tcp, dst_port: 443, payload: tls_client_hello}
#       action: ratelimit
#       profile: handshake_cap
#     - name: cap_quic_handshakes  # ...and its own ceiling for QUIC/HTTP-3
#       match: {proto: udp, dst_port: 443, payload: quic_initial}
#       action: ratelimit
#       profile: quic_handshake_cap
#
#   limits:
#     max_dynamic_rules: 4096      # must be >= ban.max_active_bans * 8
#     max_static_rules: 256
#     max_ratelimit_sources: 1048576   # per-source token buckets (kernel memory)

ban:
  ttl_seconds: 600 # every ban auto-withdraws after this (no permanent bans)
  unban_hysteresis_seconds: 120 # traffic must stay below threshold this long to unban
  max_active_bans: 50 # refuse new bans past this cap (never blackhole half the net)
  # fallback: blackhole # if a flowspec/divert announce is REJECTED by the peer,
  #   # degrade to an RTBH route so the victim is still mitigated (the default).
  #   # Set to "none" to instead reject the ban (leaving the victim undefended).
  # max_banned_fraction: 0.05 # refuse new bans once >5% of the protected address
  #   # space (per family) is blackholed — bounds the blast radius of a poisoned
  #   # baseline or spoofed-source storm. 0 (default) disables this guard.
  # max_bans_per_window: 100 # storm guard: at most this many NEW bans per window
  # ban_window_seconds: 60   # the window for max_bans_per_window (required when set)
  state_file: /var/lib/kapkan/bans.json # persist active bans so a restart (e.g. an
  #   # upgrade) rehydrates and re-announces them on startup instead of dropping
  #   # mitigation until re-detection. Pairs with BGP Graceful Restart (bgp.graceful_restart)
  #   # to keep routes up across the gap. The shipped systemd unit provides the
  #   # directory via StateDirectory=kapkan. Empty disables persistence.

bgp:
  local_asn: 65001
  router_id: "10.0.0.1" # must be an IPv4 dotted-quad
  next_hop: "192.0.2.1" # IPv4 blackhole (discard) next-hop
  next_hop6: "100::1" # IPv6 blackhole next-hop (RFC 6666 discard prefix)
  community: "65000:666" # RTBH community your upstream honors
  # communities: ["65000:666", "65000:777"] # full set (overrides `community`)
  # local_pref: 100      # optional LOCAL_PREF on blackholes (iBGP peers); 0 = omit
  neighbors:
    - address: "10.0.0.254"
      remote_asn: 65000
  # Graceful Restart: on by default. A peer that supports it RETAINS kapkan's
  # mitigation routes as stale while the session is down (e.g. during an upgrade)
  # instead of flushing them the instant it drops. Advertising the capability is
  # harmless to a peer that does not support it. (Bridges the session gap; a
  # stock peer purges the retained routes once the restarted instance signals
  # End-of-RIB, until active bans are re-announced on startup — a planned
  # follow-up.) Routes linger up to restart_seconds if kapkan never comes back.
  # graceful_restart:
  #   enabled: true             # set false to opt out
  #   restart_seconds: 120      # how long the peer holds routes as stale (1..4095)
  #   long_lived: false         # LLGR: extend retention beyond restart_seconds
  #   long_lived_stale_seconds: 3600  # LLGR stale time when long_lived is set (<=86400)

# Hostgroups can override the blackhole BGP attributes so different customers
# signal their own upstreams. Each unset field inherits the global bgp block;
# the resolved attributes are frozen per ban (a reload only affects new bans).
#
# hostgroups:
#   - name: customer-a
#     networks: ["203.0.113.64/26"]
#     bgp:
#       communities: ["65000:100", "65001:200"]
#       next_hop: "192.0.2.50"
#       local_pref: 250

notify:
  telegram:
    token_env: "KAPKAN_TG_TOKEN" # token is read from this env var, never the file
    chat_id: "-1001234567890"
  webhook:
    url: "" # optional: generic JSON POST on every attack start/end
    # payload schema: docs/callback-schema.json (check schema_version)
  slack:
    webhook_url: "" # optional: Slack incoming webhook
  email: # optional: SMTP; credentials from env vars
    smtp_host: "" # "mail.example.com:587"; empty disables
    from: ""
    to: [] # ["ops@example.com"]
    username_env: "KAPKAN_SMTP_USER"
    password_env: "KAPKAN_SMTP_PASS"
    require_tls: false # STARTTLS is auto-required when credentials are set
  exec: # optional: hook run on every attack event (no shell)
    # Absolute path to an existing executable. Runs with a minimal environment
    # (no daemon secrets); the whole process group is killed on timeout.
    command: ""
    timeout_seconds: 10
    # format: kapkan (default) passes the event name as $1 and the JSON payload
    # on stdin. format: fastnetmon mimics FastNetMon's notify_script — argv is
    # "<ip> <direction> <pps> <action>" (action: ban|unban|attack_details) with
    # a text summary on stdin — so existing FastNetMon scripts run unchanged.
    # In dry-run kapkan only ever emits attack_details (never ban/unban), so a
    # FastNetMon ban script cannot block a host you are only validating.
    # format: fastnetmon

# Optional ClickHouse history (forensics + dashboard graphs). kapkan uses
# the HTTP interface — no driver dependency. Absent = live data only.
# Persistence is best-effort: a slow/down ClickHouse drops rows, never
# blocks detection.
#
# storage:
#   clickhouse:
#     url: "http://127.0.0.1:8123"
#     database: "kapkan"
#     username_env: "KAPKAN_CH_USER"
#     password_env: "KAPKAN_CH_PASS"
#     ttl_days: 7
#     flush_interval_seconds: 5
#     batch_size: 1000
#     queue_size: 100000
#     traffic_interval_seconds: 10

# Optional GeoIP/ASN attribution of attack-sample sources ("from where / from
# which AS"). Point at MaxMind GeoLite2 (or GeoIP2) .mmdb files; both are
# optional and independent. When enabled, attack samples carry a per-source
# ASN/country, the API/dashboard show a per-ASN top-talkers breakdown, and the
# top ASNs are persisted alongside top sources in ClickHouse. Database-path
# changes require a restart. Absent/disabled = no attribution.
#
# geoip:
#   enabled: true
#   asn_database: "/var/lib/kapkan/GeoLite2-ASN.mmdb"
#   country_database: "/var/lib/kapkan/GeoLite2-Country.mmdb"

api:
  listen: "127.0.0.1:8080" # default localhost bind needs no auth
  dashboard: true # embedded web UI at / on this listener; false = JSON API only
  # AUTH — REQUIRED before exposing beyond localhost. Secrets come from env
  # vars, never the file. Use ONE of:
  #
  # token_env: "KAPKAN_API_TOKEN" # a single operator token (read + mutate)
  #
  # tokens: # or role-based: viewer = read-only, operator = read + ban/reload
  #   - {name: dashboard,  token_env: "KAPKAN_API_RO", role: viewer}
  #   - {name: automation, token_env: "KAPKAN_API_RW", role: operator}
  #   # add `tenant: "<name>"` to scope a token to one tenant (multi-tenancy):
  #   - {name: custA, token_env: "KAPKAN_API_CUSTA", role: viewer, tenant: "customerA"}

# Optional, opt-in check for a newer kapkan release. OFF by default: kapkan never
# phones home unless you enable this. The running version is always exposed
# locally (the kapkan_build_info metric and /api/v1/status) with zero egress.
# When enabled, kapkan polls the GitHub Releases API and surfaces "a newer
# version exists" on /api/v1/status, the kapkan_update_available metric and a
# log line. It sends only the request itself (IP + a generic User-Agent) — never
# node identity, config or attack data — off the startup path with a bounded
# timeout. (`kapkan -check-update` runs the same check once, on demand.)
# update_check:
#   enabled: true
#   interval_seconds: 21600 # default 6h; floored at 3600 (1h)
#   channel: stable         # stable | prerelease
#   notify: false           # also send "update available" via notify channels (Telegram/webhook/Slack/email)
#   # url: "https://api.github.com/repos/fornex/kapkan/releases/latest" # mirror/proxy override
