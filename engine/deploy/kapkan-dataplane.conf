# kapkan systemd drop-in: the extra privileges the XDP data plane needs.
#
# Install ONLY on hosts where dataplane.enabled is true:
#
#   install -D -m 0644 kapkan-dataplane.conf \
#       /etc/systemd/system/kapkan.service.d/10-dataplane.conf
#   systemctl daemon-reload && systemctl restart kapkan
#
# WHY A DROP-IN AND NOT AN EDIT TO kapkan.service. Everything below is a
# relaxation of the shipped hardening, and most deployments do not need any of
# it: a kapkan that mitigates through BGP (blackhole, flowspec, divert) touches
# no BPF, no bpffs and no netlink, and giving every such box CAP_BPF and
# CAP_PERFMON buys nothing. The privileges are opt-in for the same reason the
# feature is, and by the same switch — one config flag, one drop-in.
#
# Without this file, `dataplane.enabled: true` FAILS AT STARTUP. That is by
# design (internal/app.startDataplane treats it as fatal): an operator who asked
# for in-kernel drops must not get a daemon that came up without them. The
# failure names the cause; this file is the fix.
#
# Every line was measured on kernel 6.12.76-linuxkit and is argued in
# engine/deploy/dataplane-operations.md — read §1 before changing any of it.

[Service]
# The three capabilities, and only the three. CAP_BPF gates bpf(2) itself,
# CAP_NET_ADMIN gates loading and attaching an XDP program (XDP is a net-admin
# program type), and CAP_PERFMON is what makes the verifier allow the pointer
# subtraction kapkan_xdp.c uses to compute a frame length — without it the
# program does not load AT ALL, and the failure arrives as a verifier log
# (EACCES), which reads like a kapkan bug and is not one.
#
# AmbientCapabilities is what the process starts with, so this works with the
# unit's User=kapkan; CapabilityBoundingSet caps what it could ever regain.
# CAP_SYS_ADMIN is NOT needed and must not be added.
AmbientCapabilities=CAP_BPF CAP_NET_ADMIN CAP_PERFMON
CapabilityBoundingSet=CAP_BPF CAP_NET_ADMIN CAP_PERFMON

# ProtectKernelTunables mounts BOTH /sys and /sys/fs/bpf read-only (systemd
# v255 src/core/namespace.c lists /sys/fs/bpf explicitly), so with it on, kapkan
# cannot create the pins under dataplane.pin_path — which means no `on_exit:
# keep`, no policy surviving a restart, and a hard failure at startup. There is
# no ReadWritePaths= that undoes it for a path systemd mounted read-only as part
# of the same protection, so the option itself has to go.
#
# What is actually given up: /proc/sys, /sys, /proc/sysrq-trigger et al. become
# writable to a process that already holds CAP_BPF and CAP_NET_ADMIN. The rest
# of the hardening in kapkan.service (ProtectSystem=strict, ProtectHome,
# NoNewPrivileges, RestrictNamespaces, MemoryDenyWriteExecute, PrivateTmp)
# still applies.
ProtectKernelTunables=false
ReadWritePaths=/sys/fs/bpf

# The base unit restricts sockets to AF_INET and AF_INET6. Bringing up the data
# plane needs AF_NETLINK as well: resolving an interface name to an ifindex
# (net.InterfaceByName) is an RTNETLINK call, so without this every configured
# interface fails to attach and the daemon refuses to start. Assignments are
# cumulative, so this ADDS to the base list rather than replacing it.
RestrictAddressFamilies=AF_NETLINK

# BPF maps are charged to this unit's memory cgroup on 5.11+ (memcg accounting,
# not RLIMIT_MEMLOCK). At the default dataplane.limits that is ~235 MiB on a
# 16-core box, allocated in one step at load, so a MemoryMax= that was
# comfortable before the data plane existed will OOM the unit at startup.
# Accounting is enabled here so `systemctl show kapkan -p MemoryPeak` is
# meaningful; set MemoryMax yourself after watching it for a week.
MemoryAccounting=yes
# MemoryMax=512M

# Harmless on 5.11+, which ignores it for maps, and the thing that keeps the
# unit working if this binary is ever run on an older kernel.
LimitMEMLOCK=infinity

# NOT SET, deliberately, and worth knowing if you add hardening of your own:
#
#   SystemCallFilter=@system-service    -> blocks bpf(2)
#     bpf is in systemd's @privileged group and NOT in @system-service
#     (measured on systemd 255). If you add a syscall filter, it must read
#     `SystemCallFilter=@system-service bpf` or the very first bpf(2) dies with
#     SIGSYS. The base unit sets no filter, so there is nothing to fix here.
#
#   PrivateNetwork=yes                  -> no host interfaces to attach to.
