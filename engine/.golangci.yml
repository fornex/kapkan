version: "2"

linters:
  default: standard
  enable:
    - misspell
    - unconvert
    - copyloopvar
  settings:
    staticcheck:
      # -SA4023 ("comparison is always true/false" on a returned error) is off for
      # the GOOS=darwin pass CI runs, not because the check is wrong but because
      # it is structurally unanswerable here. Every //go:build !linux stub —
      # InspectPins, the scrub and app data-plane entry points — fails
      # UNCONDITIONALLY on purpose, so that the rendering and wiring around it
      # compiles and is tested on the macOS development host. Type-checked for a
      # non-Linux GOOS, `if err != nil` after such a call is indeed always taken;
      # type-checked for Linux it is the real error check. Restructuring a stub to
      # return a sometimes-nil error would contort the source to flatter the
      # linter, and six //nolint comments would have to be re-added to every new
      # stub. staticcheck 2.13 started reporting it; 2.11 did not.
      checks: ["all", "-ST1000", "-QF1008", "-SA4023"]

formatters:
  enable:
    - gofmt
    - goimports
