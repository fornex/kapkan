# Zone closed.example.net — generated by kapkan edge, DO NOT EDIT (see kapkan_00_common.conf).

upstream kapkan_origin_closed_example_net_566626 {
    server localhost:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name closed.example.net;
    access_log syslog:server=unix:/run/kapkan/edge-log.sock,nohostname,tag=kapkan kapkan_edge;

    location ^~ /.well-known/acme-challenge/ {
        proxy_pass http://kapkan_challenge;
        proxy_set_header Host $host;
        proxy_set_header X-Kapkan-Zone closed.example.net;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name closed.example.net;

    ssl_certificate     /var/lib/kapkan/edge/certs/closed.example.net/fullchain.pem;
    ssl_certificate_key /var/lib/kapkan/edge/certs/closed.example.net/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:kapkan_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log syslog:server=unix:/run/kapkan/edge-log.sock,nohostname,tag=kapkan kapkan_edge;

    # try_files below stats a path under this root and never finds one: the
    # directory holds nothing. Rate-limit rejections answer 429, deliberately
    # outside the 5xx set the decision error_page catches.
    root /var/lib/kapkan/edge/empty;
    limit_req_status 429;
    limit_conn_status 429;

    location ^~ /.well-known/acme-challenge/ {
        proxy_pass http://kapkan_challenge;
        proxy_set_header Host $host;
        proxy_set_header X-Kapkan-Zone closed.example.net;
    }

    # The decision subrequest (edge-spec §5): headers only, never the body;
    # tight timeouts so a stalled decider cannot hold requests hostage.
    location = /_kapkan/decide {
        internal;
        proxy_pass http://kapkan_decide/decide;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Kapkan-Zone closed.example.net;
        proxy_set_header X-Kapkan-Client $remote_addr;
        proxy_set_header X-Kapkan-Method $request_method;
        proxy_set_header X-Kapkan-URI $request_uri;
        proxy_set_header X-Kapkan-User-Agent $http_user_agent;
        proxy_connect_timeout 50ms;
        proxy_send_timeout 100ms;
        proxy_read_timeout 200ms;
    }

    # Every allowed request ends here, whether it came through the decision or
    # around a failed one. Named locations do not inherit a location's
    # error_page, so an origin failure below is reported as-is, not retried.
    location @kapkan_pass {
        proxy_pass http://kapkan_origin_closed_example_net_566626;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Kapkan-Mark $kapkan_mark;
    }

    location @kapkan_unavailable {
        return 503;
    }

    location / {
        limit_req zone=kapkan_rps_closed_example_net_566626 burst=200 nodelay;
        limit_conn kapkan_conn_closed_example_net_566626 50;
        auth_request /_kapkan/decide;
        auth_request_set $kapkan_mark $upstream_http_x_kapkan_mark;
        # failure_mode: closed — the same failure is answered with 503.
        error_page 500 502 503 504 = @kapkan_unavailable;
        try_files /dev/null @kapkan_pass;
    }
}
