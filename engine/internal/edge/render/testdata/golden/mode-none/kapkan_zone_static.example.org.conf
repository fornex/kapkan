# Zone static.example.org — generated by kapkan edge, DO NOT EDIT (see kapkan_00_common.conf).

upstream kapkan_origin_static_example_org_e16eab {
    # A hostname here is resolved once, when nginx loads the configuration; a
    # name that does not resolve fails `nginx -t` for the whole generation.
    server [2001:db8::10]:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name static.example.org;
    access_log syslog:server=unix:/run/kapkan/edge-log.sock,nohostname,tag=kapkan kapkan_edge;

    # ACME HTTP-01 (edge-spec §3): a GET/HEAD of a token, nothing else, and no
    # body is ever carried into kapkan.
    location ^~ /.well-known/acme-challenge/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://kapkan_challenge;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Kapkan-Zone static.example.org;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name static.example.org;

    ssl_certificate     /var/lib/kapkan/edge/certs/static.example.org/fullchain.pem;
    ssl_certificate_key /var/lib/kapkan/edge/certs/static.example.org/privkey.pem;
    # Honoured per zone from nginx 1.29.2 and on Angie; older nginx applies the
    # catch-all's node-wide floor instead (see kapkan_00_common.conf).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:kapkan_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log syslog:server=unix:/run/kapkan/edge-log.sock,nohostname,tag=kapkan kapkan_edge;

    # try_files below stats a path under this root and never finds one: the
    # directory holds nothing. Every directory on the way to it must be
    # traversable by the terminator's worker user, or each request logs a
    # [crit] stat failure (while still passing).
    root /var/lib/kapkan/edge/empty;

    location ^~ /.well-known/acme-challenge/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://kapkan_challenge;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Kapkan-Zone static.example.org;
    }

    # Every allowed request ends here, whether it came through the decision or
    # around a failed one. Named locations do not inherit a location's
    # error_page, so an origin failure below is reported as-is, not retried.
    location @kapkan_pass {
        proxy_pass http://kapkan_origin_static_example_org_e16eab;
        proxy_http_version 1.1;
        # Cleared for ordinary requests so upstream keepalive works; "upgrade"
        # for an Upgrade request so a WebSocket tunnels (see kapkan_00_common.conf).
        proxy_set_header Connection $kapkan_connection;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        # kapkan owns these two headers towards the origin: a client cannot
        # forge a zone or a mark, and an empty value removes the header.
        proxy_set_header X-Kapkan-Zone static.example.org;
        proxy_set_header X-Kapkan-Mark "";
    }

    location / {
        try_files /dev/null @kapkan_pass;
    }

    # The one escape hatch (edge-spec §4): included verbatim, you own what it
    # breaks — `nginx -t` is the only guard.
    include /etc/kapkan/extra/static.example.org.conf;
}
