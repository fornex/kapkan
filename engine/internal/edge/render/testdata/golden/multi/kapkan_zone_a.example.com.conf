# Zone a.example.com — generated by kapkan edge, DO NOT EDIT (see kapkan_00_common.conf).

upstream kapkan_origin_a_example_com_7653e4 {
    server 10.0.2.1:80;
    keepalive 32;
}

server {
    listen 80;
    server_name a.example.com;
    access_log syslog:server=unix:/run/kapkan-test/log.sock,nohostname,tag=kapkan kapkan_edge;

    location ^~ /.well-known/acme-challenge/ {
        proxy_pass http://kapkan_challenge;
        proxy_set_header Host $host;
        proxy_set_header X-Kapkan-Zone a.example.com;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name a.example.com;

    ssl_certificate     /var/lib/kapkan/edge/certs/a.example.com/fullchain.pem;
    ssl_certificate_key /var/lib/kapkan/edge/certs/a.example.com/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:kapkan_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log syslog:server=unix:/run/kapkan-test/log.sock,nohostname,tag=kapkan kapkan_edge;

    # try_files below stats a path under this root and never finds one: the
    # directory holds nothing. Rate-limit rejections answer 429, deliberately
    # outside the 5xx set the decision error_page catches.
    root /srv/kapkan-empty;
    limit_req_status 429;
    limit_conn_status 429;

    location ^~ /.well-known/acme-challenge/ {
        proxy_pass http://kapkan_challenge;
        proxy_set_header Host $host;
        proxy_set_header X-Kapkan-Zone a.example.com;
    }

    # Every allowed request ends here, whether it came through the decision or
    # around a failed one. Named locations do not inherit a location's
    # error_page, so an origin failure below is reported as-is, not retried.
    location @kapkan_pass {
        proxy_pass http://kapkan_origin_a_example_com_7653e4;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        limit_conn kapkan_conn_a_example_com_7653e4 10;
        try_files /dev/null @kapkan_pass;
    }
}
