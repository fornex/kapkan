    listen [::]:80;
    server_name a-very-long-zone-name-that-does-not-fit-the-default-hash-bucket.example.com;
    access_log syslog:server=unix:/run/kapkan/edge-log.sock,nohostname,tag=kapkan kapkan_edge;

    # ACME HTTP-01 (edge-spec §3): a GET/HEAD of a token, nothing else, and no
    # body is ever carried into kapkan.
    location ^~ /.well-known/acme-challenge/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://kapkan_challenge;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Kapkan-Zone a-very-long-zone-name-that-does-not-fit-the-default-hash-bucket.example.com;
    }

    location / {
        return 301 https://$host$request_uri;
