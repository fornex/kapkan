server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name a-very-long-zone-name-that-does-not-fit-the-default-hash-bucket.example.com;

    ssl_certificate     /var/lib/kapkan/edge/certs/a-very-long-zone-name-that-does-not-fit-the-default-hash-bucket.example.com/fullchain.pem;
    ssl_certificate_key /var/lib/kapkan/edge/certs/a-very-long-zone-name-that-does-not-fit-the-default-hash-bucket.example.com/privkey.pem;
    # Honoured per zone from nginx 1.29.2 and on Angie; older nginx applies the
    # catch-all's node-wide floor instead (see kapkan_00_common.conf).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:kapkan_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log syslog:server=unix:/run/kapkan/edge-log.sock,nohostname,tag=kapkan kapkan_edge;

    # try_files below stats a path under this root and never finds one: the
    # directory holds nothing. Every directory on the way to it must be
    # traversable by the terminator's worker user, or each request logs a
    # [crit] stat failure (while still passing).
    root /var/lib/kapkan/edge/empty;

    location ^~ /.well-known/acme-challenge/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://kapkan_challenge;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Kapkan-Zone a-very-long-zone-name-that-does-not-fit-the-default-hash-bucket.example.com;
