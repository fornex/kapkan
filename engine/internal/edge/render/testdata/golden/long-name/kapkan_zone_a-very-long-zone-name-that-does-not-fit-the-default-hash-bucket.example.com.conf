upstream kapkan_origin_a_very_long_zone_name_that_does_not_fit_the_default_hash_bucket_example_com_1bb9d3 {
    # A hostname here is resolved once, when nginx loads the configuration; a
    # name that does not resolve fails `nginx -t` for the whole generation.
    server 10.0.0.9:8080;
    keepalive 32;
