# Zone example.com — generated by kapkan edge, DO NOT EDIT (see kapkan_00_common.conf).

upstream kapkan_origin_example_com_a379a6 {
    # A hostname here is resolved once, when nginx loads the configuration; a
    # name that does not resolve fails `nginx -t` for the whole generation.
    server 10.0.0.1:8080;
    server 10.0.0.2:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    access_log syslog:server=unix:/run/kapkan-edge/edge-log.sock,nohostname,tag=kapkan kapkan_edge;

    # ACME HTTP-01 (edge-spec §3): a GET/HEAD of a token, nothing else, and no
    # body is ever carried into kapkan.
    location ^~ /.well-known/acme-challenge/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://kapkan_challenge;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Kapkan-Zone example.com;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    ssl_certificate     /var/lib/kapkan/edge/certs/example.com/fullchain.pem;
    ssl_certificate_key /var/lib/kapkan/edge/certs/example.com/privkey.pem;
    # Honoured per zone from nginx 1.29.2 and on Angie; older nginx applies the
    # catch-all's node-wide floor instead (see kapkan_00_common.conf).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:kapkan_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log syslog:server=unix:/run/kapkan-edge/edge-log.sock,nohostname,tag=kapkan kapkan_edge;

    # try_files below stats a path under this root and never finds one: the
    # directory holds nothing. Every directory on the way to it must be
    # traversable by the terminator's worker user, or each request logs a
    # [crit] stat failure (while still passing).
    root /var/lib/kapkan-edge/empty;

    location ^~ /.well-known/acme-challenge/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://kapkan_challenge;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Kapkan-Zone example.com;
    }

    # The decision subrequest (edge-spec §5): kapkan's headers only — never
    # the body, and never the client's own headers, which could otherwise
    # push the subrequest off the contract (a 40 KiB cookie, a control byte);
    # tight timeouts so a stalled decider cannot hold requests hostage. The
    # one client value that travels is the clearance cookie's VALUE, alone,
    # in its own header (E4), already shaped like a token (see the map in
    # kapkan_00_common.conf): the decider bounds and verifies it. X-Kapkan-Path is
    # nginx's normalised, decoded path ($uri: dot segments merged, no query),
    # the form the rung's exempt_paths are matched against; X-Kapkan-URI stays
    # the raw request target for the log and the page.
    location = /_kapkan/decide {
        internal;
        proxy_pass http://kapkan_decide/decide;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Connection "";
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Kapkan-Zone example.com;
        proxy_set_header X-Kapkan-Client $remote_addr;
        proxy_set_header X-Kapkan-Method $request_method;
        proxy_set_header X-Kapkan-URI $request_uri;
        proxy_set_header X-Kapkan-Path $uri;
        proxy_set_header X-Kapkan-Clearance $kapkan_clr_safe;
        proxy_connect_timeout 50ms;
        proxy_send_timeout 100ms;
        proxy_read_timeout 200ms;
        # failure_mode: open — a decider that is down, slow or off-contract is
        # absorbed HERE, inside the subrequest, as an undecided 200. The main
        # request never sees a 500 (which nginx would answer with
        # Connection: close), so its keepalive survives, and the origin gets
        # the request with no mark.
        proxy_intercept_errors on;
        error_page 500 502 503 504 =200 /_kapkan/undecided;
    }

    location = /_kapkan/undecided {
        internal;
        return 200;
    }

    # The clearance page's public endpoints (edge-spec §5, E4): the puzzle and
    # its answer, under the kapkan-reserved /_kapkan/ prefix of every zone.
    # No decision is asked here — a challenged client must be able to reach
    # the page — and nearly the subrequest's contract: kapkan's headers, the
    # cookie value (shaped, see kapkan_00_common.conf), and of the client's own
    # headers only Content-Type and Accept-Language, plus a small body for the
    # answer.
    location ^~ /_kapkan/clearance/ {
        limit_except GET HEAD POST { deny all; }
        client_max_body_size 4k;
        proxy_pass http://kapkan_clearance;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The body's own Content-Length is nginx's default header for a
        # proxied body; the client's Content-Type is needed because the answer
        # is JSON or a form, Accept-Language because the page is localised.
        proxy_set_header Content-Type $content_type;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_set_header X-Kapkan-Zone example.com;
        proxy_set_header X-Kapkan-Client $remote_addr;
        proxy_set_header X-Kapkan-Method $request_method;
        proxy_set_header X-Kapkan-URI $request_uri;
        proxy_set_header X-Kapkan-Clearance $kapkan_clr_safe;
        proxy_connect_timeout 50ms;
        proxy_send_timeout 1s;
        proxy_read_timeout 2s;
    }

    # A 401 from the decision service lands here: the clearance page is served
    # in place of the origin, with the same reasons the log carries. The page
    # server failing follows the zone's failure_mode exactly as a failed
    # decision would. The request's URI is passed UNCHANGED (a rewrite here
    # would follow the request into @kapkan_pass and reach the origin as the
    # page's path); the page knows this entry point by X-Kapkan-Reason, which
    # only this location sets.
    location @kapkan_clearance {
        proxy_pass http://kapkan_clearance;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Connection "";
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_set_header X-Kapkan-Zone example.com;
        proxy_set_header X-Kapkan-Client $remote_addr;
        proxy_set_header X-Kapkan-Method $request_method;
        proxy_set_header X-Kapkan-URI $request_uri;
        proxy_set_header X-Kapkan-Reason $kapkan_reason;
        proxy_connect_timeout 50ms;
        proxy_send_timeout 1s;
        proxy_read_timeout 2s;
        # A second error_page on a request that already took one (the 401 in
        # location /): honoured because location / sets recursive_error_pages
        # — see there. Neither target has an error_page of its own, so this
        # cannot loop.
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @kapkan_pass;
    }

    # Every allowed request ends here, whether it came through the decision or
    # around a failed one. Named locations do not inherit a location's
    # error_page, so an origin failure below is reported as-is, not retried.
    location @kapkan_pass {
        proxy_pass http://kapkan_origin_example_com_a379a6;
        proxy_http_version 1.1;
        # Cleared for ordinary requests so upstream keepalive works; "upgrade"
        # for an Upgrade request so a WebSocket tunnels (see kapkan_00_common.conf).
        proxy_set_header Connection $kapkan_connection;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        # kapkan owns these two headers towards the origin: a client cannot
        # forge a zone or a mark, and an empty value removes the header.
        proxy_set_header X-Kapkan-Zone example.com;
        proxy_set_header X-Kapkan-Mark $kapkan_mark;
    }

    # A denial's status: the decision service says why (X-Kapkan-Reason). A
    # client that ran over its ceiling gets 429 with a Retry-After — the
    # answer a browser or SDK retries — and one the verdict table refuses
    # gets 403.
    location @kapkan_denied {
        if ($kapkan_reason ~ "^(rate|concurrency)$") {
            add_header Retry-After 1 always;
            return 429;
        }
        return 403;
    }

    location / {
        auth_request /_kapkan/decide;
        auth_request_set $kapkan_mark $kapkan_decided_mark;
        auth_request_set $kapkan_decision $upstream_status;
        auth_request_set $kapkan_reason $upstream_http_x_kapkan_reason;
        # The 401 goes to the clearance page, whose own failure must then be
        # allowed a SECOND error_page (to the origin or a 503, per
        # failure_mode). nginx marks a request at its first error_page and
        # ignores later ones unless this is on HERE, where the first one is
        # taken; the targets below have no error_page of their own, so the
        # recursion is one level deep and cannot loop.
        recursive_error_pages on;
        error_page 401 = @kapkan_clearance;
        error_page 403 = @kapkan_denied;
        # Second net for failure_mode: open — anything the subrequest could
        # not absorb (an off-contract 3xx, say) still passes, undecided.
        error_page 500 502 503 504 = @kapkan_pass;
        try_files /dev/null @kapkan_pass;
    }
}
