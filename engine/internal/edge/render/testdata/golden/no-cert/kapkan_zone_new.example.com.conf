# Zone new.example.com — generated by kapkan edge, DO NOT EDIT (see kapkan_00_common.conf).
#
# NO CERTIFICATE YET: only the plain-HTTP listener is rendered, and it serves
# nothing but ACME challenges — kapkan never proxies a zone over cleartext.
# The TLS server appears on the first render after issuance (edge-spec §3).

upstream kapkan_origin_new_example_com_d42059 {
    # A hostname here is resolved once, when nginx loads the configuration; a
    # name that does not resolve fails `nginx -t` for the whole generation.
    server 10.0.0.5:80;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name new.example.com;
    access_log syslog:server=unix:/run/kapkan-edge/edge-log.sock,nohostname,tag=kapkan kapkan_edge;

    # ACME HTTP-01 (edge-spec §3): a GET/HEAD of a token, nothing else, and no
    # body is ever carried into kapkan.
    location ^~ /.well-known/acme-challenge/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://kapkan_challenge;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Kapkan-Zone new.example.com;
    }

    location / {
        return 503;
    }
}
