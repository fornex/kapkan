# The TLS server appears on the first render after issuance (edge-spec §3).

upstream kapkan_origin_new_example_com_d42059 {
    server 10.0.0.5:80;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name new.example.com;
    access_log syslog:server=unix:/run/kapkan/edge-log.sock,nohostname,tag=kapkan kapkan_edge;

