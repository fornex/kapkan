<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kapkan — Operator Console</title>

  <!-- ============================================================
       The Go binary serves this page with a strict CSP header:
       default-src 'none'; script-src 'self'; style-src 'self';
       font-src 'self'; connect-src 'self'; img-src 'self';
       base-uri 'none'; form-action 'none'; frame-ancestors 'none'
       So: no inline styles or scripts, no external resources. The fonts
       are embedded beside the scripts (fonts/, IBM Plex, SIL OFL 1.1).
       ============================================================ -->

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- before the stylesheets: puts the saved theme on <html> pre-paint -->
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="components.css">
</head>
<body>
  <div class="app" id="app">
    <!-- ============ TOP BAR ============ -->
    <header class="topbar" id="topbar">
      <button type="button" class="brand" id="brand">
        <span id="brandMark" aria-hidden="true"></span>
        <span id="brandName" aria-hidden="true"></span>
      </button>
      <div class="topbar__nav">
        <nav class="nav" id="nav"></nav>
      </div>
      <div class="topbar__spacer"></div>
      <div class="topbar__status">
        <!-- what is happening: calm, under attack, or no connection -->
        <span id="posturePill"></span>
        <!-- the mode, shown only when it is watch-only. role=status, so a mode
             change or a lost engine is announced. -->
        <span id="modeBadge" role="status"></span>
      </div>
      <div class="topbar__right">
        <span class="live" id="liveInd">
          <span class="live__dot" aria-hidden="true"></span>
          <span class="live__txt sr-only"></span>
          <span class="live__time" id="lastUpdated">--:--:--</span>
        </span>
        <button type="button" class="icon-btn" id="themeBtn"></button>
        <button type="button" class="icon-btn" id="reloadBtn" data-op="1" hidden></button>
        <button type="button" class="icon-btn nav__gear" id="gearBtn" data-view="settings"></button>
      </div>
    </header>

    <!-- ============ MAIN ============ -->
    <main class="main" id="main">
      <!-- opt-in update-available banner (populated by app.js when the update
           check reports a newer release; hidden otherwise) -->
      <div class="updbanner-slot" id="updateBanner" hidden></div>
      <section class="view" id="view-overview" data-screen-label="Overview"></section>
      <section class="view" id="view-attacks" data-screen-label="Attacks" hidden></section>
      <section class="view" id="view-bans" data-screen-label="Mitigation" hidden></section>
      <section class="view" id="view-hosts" data-screen-label="Hosts" hidden></section>
      <section class="view" id="view-nodes" data-screen-label="Packet filters" hidden></section>
      <section class="view" id="view-edge" data-screen-label="Edge zones" hidden></section>
      <section class="view" id="view-edgenodes" data-screen-label="Request filters" hidden></section>
      <section class="view" id="view-hostgroups" data-screen-label="Hostgroups" hidden></section>
      <section class="view" id="view-traffic" data-screen-label="Traffic" hidden></section>
      <section class="view" id="view-settings" data-screen-label="Settings" hidden></section>
    </main>

    <!-- ============ PHONE TAB BAR (below 900px) ============ -->
    <nav class="tabbar" id="tabbar"></nav>
  </div>

  <!-- drawer + scrim -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Attack detail" aria-hidden="true" tabindex="-1" inert></aside>

  <!-- aria-live region for new-attack announcements -->
  <div class="sr-only" role="status" aria-live="polite" id="liveRegion"></div>

  <!-- toasts -->
  <div class="toasts" id="toasts"></div>

  <!-- ===== scripts: order matters; all same-origin, no modules ===== -->
  <script src="icons.js"></script>
  <script src="i18n.js"></script>
  <script src="locales/en.js"></script>
  <script src="locales/de.js"></script>
  <script src="locales/ru.js"></script>
  <script src="locales/fr.js"></script>
  <script src="locales/es.js"></script>
  <script src="api.js"></script>
  <script src="components.js"></script>
  <script src="views.js"></script>
  <script src="views2.js"></script>
  <script src="overview.js"></script>
  <script src="app.js"></script>
</body>
</html>
